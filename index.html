<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />

  <meta
    name="description"
    content="Roadies — make broken roads visible."
  />

  <title>Roadies</title>

  <!-- Editorial typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --black: #111111;
      --gray: #777777;
      --line: #dddddd;
      --light: #f7f7f7;
      --red: #d71920;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: var(--black);
      font-family: Inter, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 28px 42px 80px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 82px;
    }

    .brand {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.22em;
    }

    .edition {
      color: #777;
      font-size: 13px;
      letter-spacing: 0.14em;
    }

    .hero {
      max-width: 760px;
    }

    .eyebrow {
      font-size: 13px;
      letter-spacing: 0.18em;
      color: #777;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(72px, 10vw, 150px);
      line-height: 0.82;
      font-weight: 500;
      letter-spacing: -0.055em;
    }

    .intro {
      margin-top: 42px;
      max-width: 500px;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 28px;
      line-height: 1.15;
    }

    .primary-button {
      margin-top: 42px;
      width: 100%;
      max-width: 430px;
      min-height: 64px;
      border: none;
      background: var(--black);
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.16em;
    }

    .primary-button:disabled {
      background: #dddddd;
      color: #999999;
      cursor: default;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .report {
      max-width: 720px;
    }

    .report-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(58px, 8vw, 105px);
      line-height: 0.9;
      letter-spacing: -0.05em;
      margin: 0 0 45px;
      font-weight: 500;
    }

    .photo-wrapper {
      width: 100%;
      background: #f5f5f5;
      overflow: hidden;
      margin-bottom: 36px;
    }

    #preview {
      display: block;
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
    }

    .metadata {
      border-top: 1px solid var(--black);
    }

    .meta-row {
      display: grid;
      grid-template-columns: 190px 1fr;
      min-height: 72px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      gap: 20px;
    }

    .meta-label {
      color: #777;
      font-size: 12px;
      letter-spacing: 0.16em;
    }

    .meta-value {
      font-size: 16px;
      line-height: 1.35;
    }

    .location-button {
      appearance: none;
      border: none;
      background: transparent;
      padding: 0;
      margin: 0;
      color: var(--black);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: underline;
      text-underline-offset: 5px;
      cursor: pointer;
      text-align: left;
    }

    .location-button:disabled {
      opacity: 0.45;
      cursor: default;
      text-decoration: none;
    }

    .location-detail {
      margin-top: 5px;
      color: #777;
      font-size: 13px;
    }

    .location-help {
      margin-top: 6px;
      color: #777;
      font-size: 12px;
      line-height: 1.4;
      max-width: 420px;
    }

    .comment-section {
      margin-top: 46px;
    }

    .section-label {
      display: block;
      margin-bottom: 18px;
      color: #777;
      font-size: 12px;
      letter-spacing: 0.16em;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      padding: 20px;
      resize: vertical;
      border: 1px solid #cccccc;
      border-radius: 0;
      outline: none;
      color: var(--black);
      font-size: 16px;
      line-height: 1.5;
    }

    textarea:focus {
      border-color: var(--black);
    }

    textarea::placeholder {
      color: #999999;
    }

    .character-count {
      margin-top: 10px;
      color: #888;
      font-size: 12px;
    }

    .status {
      margin-top: 22px;
      color: #555;
      font-size: 13px;
    }

    .success {
      min-height: 65vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .success-inner {
      max-width: 600px;
    }

    .success h2 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(64px, 9vw, 120px);
      line-height: 0.88;
      font-weight: 500;
      letter-spacing: -0.05em;
    }

    .success p {
      margin-top: 32px;
      color: #666;
      font-size: 15px;
      line-height: 1.6;
    }

    .secondary-button {
      margin-top: 35px;
      background: white;
      border: 1px solid var(--black);
      padding: 18px 26px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.13em;
    }

    .error-message {
      margin-top: 25px;
      padding: 18px;
      background: #fafafa;
      border-left: 3px solid var(--red);
      color: #555;
      font-size: 13px;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    #fileInput {
      display: none;
    }

    @media (max-width: 700px) {
      .page {
        padding: 25px 43px 65px;
      }

      header {
        margin-bottom: 70px;
      }

      .meta-row {
        grid-template-columns: 1fr;
        gap: 7px;
        padding: 18px 0;
      }

      .meta-label {
        align-self: end;
      }

      .primary-button {
        max-width: none;
      }

      .intro {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <!-- ========================================================= -->
    <!-- HOME -->
    <!-- ========================================================= -->

    <section id="homeScreen" class="screen active">

      <header>
        <div class="brand">ROADIES</div>
        <div class="edition">INDIA / 01</div>
      </header>

      <div class="hero">

        <div class="eyebrow">01</div>

        <h1>
          Better roads<br>
          begin here.
        </h1>

        <div class="intro">
          See a broken road?<br>
          Make it visible.
        </div>

        <button
          id="startButton"
          class="primary-button"
          type="button"
        >
          REPORT A BROKEN ROAD
        </button>

      </div>

    </section>


    <!-- ========================================================= -->
    <!-- REPORT -->
    <!-- ========================================================= -->

    <section id="reportScreen" class="screen">

      <header>
        <div class="brand">ROADIES</div>
        <div class="edition">INDIA / 01</div>
      </header>

      <div class="report">

        <h1 class="report-title">
          Almost<br>
          there.
        </h1>

        <div class="photo-wrapper">
          <img id="preview" alt="Road report photo">
        </div>

        <div class="metadata">

          <!-- PHOTO -->

          <div class="meta-row">
            <div class="meta-label">PHOTO</div>
            <div id="photoSize" class="meta-value">
              Preparing...
            </div>
          </div>


          <!-- LOCATION -->

          <div class="meta-row">

            <div class="meta-label">
              LOCATION
            </div>

            <div id="locationStatus" class="meta-value">

              <button
                id="locationButton"
                class="location-button"
                type="button"
              >
                SHARE MY LOCATION
              </button>

            </div>

          </div>


          <!-- DIGIPIN -->

          <div
            id="digipinRow"
            class="meta-row hidden"
          >

            <div class="meta-label">
              DIGIPIN
            </div>

            <div
              id="digipinValue"
              class="meta-value"
            ></div>

          </div>


          <!-- GPS -->

          <div
            id="gpsRow"
            class="meta-row hidden"
          >

            <div class="meta-label">
              GPS
            </div>

            <div
              id="gpsValue"
              class="meta-value"
            ></div>

          </div>

        </div>


        <!-- COMMENT -->

        <div class="comment-section">

          <label
            class="section-label"
            for="commentInput"
          >
            ANYTHING ELSE?
          </label>

          <textarea
            id="commentInput"
            maxlength="300"
            placeholder="Tell us what is wrong here. Optional."
          ></textarea>

          <div class="character-count">
            Max 300 characters
          </div>

        </div>


        <div
          id="statusMessage"
          class="status"
        >
          Photo preparing...
        </div>


        <button
          id="sendButton"
          class="primary-button"
          type="button"
          disabled
        >
          SEND PHOTO
        </button>


        <div
          id="errorMessage"
          class="error-message hidden"
        ></div>

      </div>

    </section>


    <!-- ========================================================= -->
    <!-- SUCCESS -->
    <!-- ========================================================= -->

    <section id="successScreen" class="screen">

      <header>
        <div class="brand">ROADIES</div>
        <div class="edition">INDIA / 01</div>
      </header>

      <div class="success">

        <div class="success-inner">

          <h2>
            Seen.<br>
            Reported.
          </h2>

          <p>
            Thanks for making the road visible.
          </p>

          <button
            id="newReportButton"
            class="secondary-button"
            type="button"
          >
            REPORT ANOTHER ROAD
          </button>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================================================== -->
  <!-- HIDDEN CAMERA INPUT -->
  <!-- =========================================================== -->

  <input
    id="fileInput"
    type="file"
    accept="image/*"
    capture="environment"
  />


<script>
/* ===============================================================
   ROADIES CONFIG
   =============================================================== */

const SUPABASE_URL =
  "https://rdxavtxfifvuwrcnsga.supabase.co";

/*
   PUT YOUR SUPABASE PUBLISHABLE KEY BETWEEN THE QUOTES BELOW.

   DO NOT USE YOUR sb_secret_ KEY HERE.
*/
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_AFElmTasdfqRKSu9kUz6BA_odt416e_";

const STORAGE_BUCKET = "road-report";
const REPORT_TABLE = "reports";


/* ===============================================================
   SUPABASE
   =============================================================== */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* ===============================================================
   DOM
   =============================================================== */

const homeScreen =
  document.getElementById("homeScreen");

const reportScreen =
  document.getElementById("reportScreen");

const successScreen =
  document.getElementById("successScreen");

const startButton =
  document.getElementById("startButton");

const fileInput =
  document.getElementById("fileInput");

const preview =
  document.getElementById("preview");

const photoSize =
  document.getElementById("photoSize");

const locationStatus =
  document.getElementById("locationStatus");

const locationButton =
  document.getElementById("locationButton");

const digipinRow =
  document.getElementById("digipinRow");

const digipinValue =
  document.getElementById("digipinValue");

const gpsRow =
  document.getElementById("gpsRow");

const gpsValue =
  document.getElementById("gpsValue");

const commentInput =
  document.getElementById("commentInput");

const statusMessage =
  document.getElementById("statusMessage");

const sendButton =
  document.getElementById("sendButton");

const errorMessage =
  document.getElementById("errorMessage");

const newReportButton =
  document.getElementById("newReportButton");


/* ===============================================================
   STATE
   =============================================================== */

let originalFile = null;
let compressedBlob = null;

let currentLocation = null;
let currentDigipin = null;

let photoReady = false;
let locationReady = false;


/* ===============================================================
   SCREEN HELPERS
   =============================================================== */

function showScreen(screen) {

  homeScreen.classList.remove("active");
  reportScreen.classList.remove("active");
  successScreen.classList.remove("active");

  screen.classList.add("active");

  window.scrollTo({
    top: 0,
    behavior: "instant"
  });
}


/* ===============================================================
   START
   =============================================================== */

startButton.addEventListener("click", () => {

  hideError();

  fileInput.value = "";

  fileInput.click();

});


/* ===============================================================
   PHOTO SELECTED
   =============================================================== */

fileInput.addEventListener("change", async () => {

  const file = fileInput.files?.[0];

  if (!file) {
    return;
  }

  originalFile = file;

  showScreen(reportScreen);

  resetReportState();

  preview.src = URL.createObjectURL(file);

  photoSize.textContent = formatKB(file.size);

  statusMessage.textContent =
    "Optimising photo...";

  try {

    compressedBlob =
      await compressImage(file);

    photoReady = true;

    photoSize.textContent =
      formatKB(compressedBlob.size);

    statusMessage.textContent =
      "Photo optimised ✓";

    updateSendButton();

  } catch (error) {

    console.error(
      "[ROADIES] PHOTO ERROR",
      error
    );

    statusMessage.textContent =
      "Could not optimise this photo.";

  }

});


/* ===============================================================
   RESET
   =============================================================== */

function resetReportState() {

  compressedBlob = null;

  currentLocation = null;
  currentDigipin = null;

  photoReady = false;
  locationReady = false;

  locationStatus.innerHTML = `
    <button
      id="locationButton"
      class="location-button"
      type="button"
    >
      SHARE MY LOCATION
    </button>
  `;

  /*
    Re-bind the button because we just replaced its HTML.
  */
  window.locationButton =
    document.getElementById("locationButton");

  window.locationButton.addEventListener(
    "click",
    requestLocation
  );

  digipinRow.classList.add("hidden");
  gpsRow.classList.add("hidden");

  sendButton.disabled = true;

  hideError();
}


/* ===============================================================
   LOCATION
   =============================================================== */

/*
  IMPORTANT:

  We DO NOT request location automatically.

  The user must tap:

      SHARE MY LOCATION

  This lets Chrome/iPhone show the native permission prompt.
*/

locationButton.addEventListener(
  "click",
  requestLocation
);


async function requestLocation() {

  hideError();

  const button =
    document.getElementById("locationButton");

  if (!navigator.geolocation) {

    locationStatus.innerHTML = `
      <div>
        Location is not supported on this device.
      </div>
    `;

    return;
  }

  button.disabled = true;
  button.textContent =
    "FINDING LOCATION...";


  /*
    Check browser permission when supported.
  */

  try {

    if (navigator.permissions) {

      const permission =
        await navigator.permissions.query({
          name: "geolocation"
        });

      if (permission.state === "denied") {

        locationStatus.innerHTML = `
          <div>
            Location permission is blocked.
          </div>

          <div class="location-help">
            Allow location access for Chrome in
            your phone settings, then tap TRY AGAIN.
          </div>

          <button
            id="locationButton"
            class="location-button"
            type="button"
            style="margin-top:10px"
          >
            TRY AGAIN
          </button>
        `;

        document
          .getElementById("locationButton")
          .addEventListener(
            "click",
            requestLocation
          );

        return;
      }
    }

  } catch (permissionError) {

    /*
      Some mobile browsers don't expose the
      Permissions API properly.

      That's okay. We continue to the actual
      geolocation request.
    */

    console.log(
      "[ROADIES] Permission API unavailable"
    );

  }


  /*
    Ask browser for actual GPS location.
  */

  navigator.geolocation.getCurrentPosition(

    function(position) {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      const accuracy =
        position.coords.accuracy;


      currentLocation = {
        latitude,
        longitude,
        accuracy
      };


      try {

        currentDigipin =
          getDigipin(
            latitude,
            longitude
          );

      } catch (digipinError) {

        console.error(
          "[ROADIES] DIGIPIN ERROR",
          digipinError
        );

        currentDigipin = null;

      }


      locationReady = true;


      /* LOCATION */

      locationStatus.innerHTML = `
        <div>
          Location found ✓
        </div>

        <div class="location-detail">
          Accuracy ±${Math.round(accuracy)} m
        </div>
      `;


      /* DIGIPIN */

      if (currentDigipin) {

        digipinRow.classList.remove(
          "hidden"
        );

        digipinValue.textContent =
          formatDigipin(currentDigipin);

      }


      /* GPS */

      gpsRow.classList.remove(
        "hidden"
      );

      gpsValue.textContent =
        `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;


      console.log(
        "[ROADIES] LOCATION",
        currentLocation
      );

      console.log(
        "[ROADIES] DIGIPIN",
        currentDigipin
      );


      statusMessage.textContent =
        "Ready to report.";

      updateSendButton();

    },


    function(error) {

      console.error(
        "[ROADIES] LOCATION ERROR",
        error
      );


      locationReady = false;

      let message =
        "Couldn't find your location.";

      let help =
        "Tap TRY AGAIN.";


      if (
        error.code ===
        error.PERMISSION_DENIED
      ) {

        message =
          "Location permission is needed.";

        help =
          "Allow location access for Chrome, then tap TRY AGAIN.";

      } else if (
        error.code ===
        error.POSITION_UNAVAILABLE
      ) {

        message =
          "Your location is unavailable.";

        help =
          "Make sure Location Services are turned on.";

      } else if (
        error.code ===
        error.TIMEOUT
      ) {

        message =
          "Location took too long.";

        help =
          "Tap TRY AGAIN.";

      }


      locationStatus.innerHTML = `
        <div>
          ${message}
        </div>

        <div class="location-help">
          ${help}
        </div>

        <button
          id="locationButton"
          class="location-button"
          type="button"
          style="margin-top:10px"
        >
          TRY AGAIN
        </button>
      `;


      document
        .getElementById("locationButton")
        .addEventListener(
          "click",
          requestLocation
        );


      statusMessage.textContent =
        "Location required before sending.";

      updateSendButton();

    },


    {
      enableHighAccuracy: false,
timeout: 30000,
maximumAge: 60000
    }

  );

}


/* ===============================================================
   SEND BUTTON
   =============================================================== */

function updateSendButton() {

  sendButton.disabled =
    !photoReady ||
    !locationReady ||
    !compressedBlob;

}


sendButton.addEventListener(
  "click",
  submitReport
);


/* ===============================================================
   SUBMIT
   =============================================================== */

async function submitReport() {

  if (
    !photoReady ||
    !compressedBlob ||
    !currentLocation
  ) {

    return;
  }


  hideError();

  sendButton.disabled = true;

  sendButton.textContent =
    "SENDING...";


  try {

    /*
      -------------------------------------------------------------
      STEP 1: Upload photo
      -------------------------------------------------------------
    */

    console.log(
      "[ROADIES] Uploading photo..."
    );


    const fileName =
      `${crypto.randomUUID()}.jpg`;


    const now =
      new Date();


    const year =
      now.getFullYear();


    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");


    const filePath =
      `${year}/${month}/${fileName}`;


    const {
      data: uploadData,
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(
          filePath,
          compressedBlob,
          {
            contentType: "image/jpeg",
            cacheControl: "3600",
            upsert: false
          }
        );


    if (uploadError) {

      console.error(
        "[ROADIES] STORAGE ERROR",
        uploadError
      );

      throw new Error(
        "PHOTO_UPLOAD_FAILED"
      );
    }


    console.log(
      "[ROADIES] Photo uploaded",
      uploadData
    );


    /*
      -------------------------------------------------------------
      STEP 2: Save report
      -------------------------------------------------------------
    */

    console.log(
      "[ROADIES] Saving report..."
    );


    const {
      data: reportData,
      error: reportError
    } =
      await supabaseClient
        .from(REPORT_TABLE)
        .insert({

          latitude:
            currentLocation.latitude,

          longitude:
            currentLocation.longitude,

          digipin:
            currentDigipin || null,

          comment:
            commentInput.value.trim() ||
            null,

          photo_url:
            uploadData.path,

          status:
            "new"

        })
        .select()
        .single();


    if (reportError) {

      console.error(
        "[ROADIES] DATABASE ERROR",
        reportError
      );

      throw new Error(
        "DATABASE_INSERT_FAILED"
      );
    }


    console.log(
      "[ROADIES] REPORT SAVED",
      reportData
    );


    /*
      -------------------------------------------------------------
      SUCCESS
      -------------------------------------------------------------
    */

    sendButton.textContent =
      "SEND PHOTO";

    showScreen(successScreen);


  } catch (error) {

    console.error(
      "[ROADIES] SUBMISSION FAILED",
      error
    );


    sendButton.disabled = false;

    sendButton.textContent =
      "SEND PHOTO";


    if (
      error.message ===
      "PHOTO_UPLOAD_FAILED"
    ) {

      showError(
        "We couldn't upload the photo. " +
        "Please check your connection and try again."
      );

    } else if (
      error.message ===
      "DATABASE_INSERT_FAILED"
    ) {

      showError(
        "The photo uploaded, but the report couldn't be saved. " +
        "Please try again."
      );

    } else {

      showError(
        "Something went wrong. Please try again."
      );

    }

  }

}


/* ===============================================================
   NEW REPORT
   =============================================================== */

newReportButton.addEventListener(
  "click",
  () => {

    originalFile = null;
    compressedBlob = null;

    currentLocation = null;
    currentDigipin = null;

    photoReady = false;
    locationReady = false;

    commentInput.value = "";

    showScreen(homeScreen);

  }
);


/* ===============================================================
   ERROR UI
   =============================================================== */

function showError(message) {

  errorMessage.textContent =
    message;

  errorMessage.classList.remove(
    "hidden"
  );

}


function hideError() {

  errorMessage.classList.add(
    "hidden"
  );

  errorMessage.textContent = "";

}


/* ===============================================================
   IMAGE COMPRESSION
   =============================================================== */

async function compressImage(file) {

  const bitmap =
    await createImageBitmap(file);


  const MAX_WIDTH = 1280;

  let width =
    bitmap.width;

  let height =
    bitmap.height;


  if (width > MAX_WIDTH) {

    const ratio =
      MAX_WIDTH / width;

    width =
      Math.round(
        width * ratio
      );

    height =
      Math.round(
        height * ratio
      );

  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha: false
      }
    );


  ctx.drawImage(
    bitmap,
    0,
    0,
    width,
    height
  );


  /*
    First compression.
  */

  let blob =
    await canvasToBlob(
      canvas,
      0.68
    );


  /*
    Keep reducing if image is too large.
  */

  if (blob.size > 400 * 1024) {

    blob =
      await canvasToBlob(
        canvas,
        0.52
      );

  }


  if (blob.size > 400 * 1024) {

    blob =
      await canvasToBlob(
        canvas,
        0.42
      );

  }


  return blob;

}


function canvasToBlob(
  canvas,
  quality
) {

  return new Promise(
    (resolve, reject) => {

      canvas.toBlob(
        (blob) => {

          if (!blob) {

            reject(
              new Error(
                "Image compression failed"
              )
            );

            return;
          }

          resolve(blob);

        },
        "image/jpeg",
        quality
      );

    }
  );

}


/* ===============================================================
   FILE SIZE
   =============================================================== */

function formatKB(bytes) {

  return `${Math.round(
    bytes / 1024
  )} KB`;

}


/* ===============================================================
   DIGIPIN
   India Post grid logic
   =============================================================== */

const DIGIPIN_GRID = [

  ["F", "C", "9", "8"],

  ["J", "3", "2", "7"],

  ["K", "4", "5", "6"],

  ["L", "M", "P", "T"]

];


const DIGIPIN_BOUNDS = {

  minLat: 2.5,

  maxLat: 38.5,

  minLon: 63.5,

  maxLon: 99.5

};


function getDigipin(
  latitude,
  longitude
) {

  if (
    latitude <
      DIGIPIN_BOUNDS.minLat ||
    latitude >
      DIGIPIN_BOUNDS.maxLat
  ) {

    throw new Error(
      "Latitude outside DIGIPIN bounds"
    );

  }


  if (
    longitude <
      DIGIPIN_BOUNDS.minLon ||
    longitude >
      DIGIPIN_BOUNDS.maxLon
  ) {

    throw new Error(
      "Longitude outside DIGIPIN bounds"
    );

  }


  let minLat =
    DIGIPIN_BOUNDS.minLat;

  let maxLat =
    DIGIPIN_BOUNDS.maxLat;

  let minLon =
    DIGIPIN_BOUNDS.minLon;

  let maxLon =
    DIGIPIN_BOUNDS.maxLon;


  let digipin = "";


  for (
    let level = 1;
    level <= 10;
    level++
  ) {

    const latDiv =
      (maxLat - minLat) / 4;

    const lonDiv =
      (maxLon - minLon) / 4;


    /*
      Latitude rows run from north to south.
    */

    let row =
      3 -
      Math.floor(
        (latitude - minLat) /
        latDiv
      );


    let col =
      Math.floor(
        (longitude - minLon) /
        lonDiv
      );


    row =
      Math.max(
        0,
        Math.min(
          row,
          3
        )
      );


    col =
      Math.max(
        0,
        Math.min(
          col,
          3
        )
      );


    digipin +=
      DIGIPIN_GRID[row][col];


    /*
      Narrow the bounding box.
    */

    const oldMinLat =
      minLat;

    const oldMinLon =
      minLon;


    maxLat =
      oldMinLat +
      latDiv *
      (4 - row);


    minLat =
      oldMinLat +
      latDiv *
      (3 - row);


    minLon =
      oldMinLon +
      lonDiv *
      col;


    maxLon =
      minLon +
      lonDiv;

  }


  return digipin;

}


/* ===============================================================
   DIGIPIN DISPLAY
   =============================================================== */

function formatDigipin(
  digipin
) {

  if (
    !digipin ||
    digipin.length !== 10
  ) {

    return digipin;

  }


  return (
    digipin.slice(0, 3) +
    " " +
    digipin.slice(3, 7) +
    " " +
    digipin.slice(7, 10)
  );

}
