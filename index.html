<script>

/* =========================================================

const homeScreen =

const cameraScreen =

  );


const reviewScreen =
  document.getElementById(
    "reviewScreen"
  );


const successScreen =
  document.getElementById(
    "successScreen"
  );


const startButton =
  document.getElementById(
    "startButton"
  );


const takePhotoButton =
  document.getElementById(
    "takePhotoButton"
  );


const anotherButton =
  document.getElementById(
    "anotherButton"
  );


const fileInput =
  document.getElementById(
    "fileInput"
  );


const photoPreview =
  document.getElementById(
    "photoPreview"
  );


const photoSize =
  document.getElementById(
    "photoSize"
  );


const locationStatus =
  document.getElementById(
    "locationStatus"
  );


const digipinRow =
  document.getElementById(
    "digipinRow"
  );


const digipinValue =
  document.getElementById(
    "digipinValue"
  );


const gpsRow =
  document.getElementById(
    "gpsRow"
  );


const gpsValue =
  document.getElementById(
    "gpsValue"
  );


const commentInput =
  document.getElementById(
    "commentInput"
  );


const statusMessage =
  document.getElementById(
    "statusMessage"
  );


const sendButton =
  document.getElementById(
    "sendButton"
  );



/* =========================================================
   STATE
   ========================================================= */

let compressedBlob =
  null;


let currentLocation = {
  latitude: null,
  longitude: null
};


let currentDigipin =
  null;


let currentObjectUrl =
  null;


let sendMode =
  "send";


let isSending =
  false;



/* =========================================================
   SCREEN
   ========================================================= */

function showScreen(screen) {

  [
    homeScreen,
    cameraScreen,
    reviewScreen,
    successScreen
  ]
  .forEach(
    item => item.classList.remove("active")
  );


  screen.classList.add("active");

}


/* =========================================================
   START
   ========================================================= */

startButton.addEventListener(
  "click",
  () => {

    openCamera();

  }
);



takePhotoButton.addEventListener(
  "click",
  () => {

    fileInput.click();

  }
);



function openCamera() {

  resetForm();

  showScreen(
    cameraScreen
  );


  setTimeout(
    () => {

      fileInput.click();

    },
    180
  );

}



/* =========================================================
   FILE SELECT
   ========================================================= */

fileInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files?.[0];


    if (!file) {
      return;
    }


    await preparePhoto(file);

  }
);



/* =========================================================
   PHOTO PREPARATION
   ========================================================= */

async function preparePhoto(file) {

  compressedBlob =
    null;


  sendMode =
    "send";


  sendButton.disabled =
    true;


  sendButton.textContent =
    "Send photo";


  statusMessage.textContent =
    "Optimising photo…";


  statusMessage.classList.remove(
    "error"
  );


  showScreen(
    reviewScreen
  );


  try {

    const blob =
      await compressImage(file);


    compressedBlob =
      blob;


    if (currentObjectUrl) {

      URL.revokeObjectURL(
        currentObjectUrl
      );

    }


    currentObjectUrl =
      URL.createObjectURL(
        blob
      );


    photoPreview.src =
      currentObjectUrl;


    photoSize.textContent =
      formatBytes(blob.size);


    statusMessage.textContent =
      "Photo optimised ✓";


    sendButton.disabled =
      false;


    findLocation();


  } catch (error) {

    console.error(
      "[ROADIES] PHOTO PREPARATION ERROR",
      error
    );


    statusMessage.textContent =
      "Could not prepare photo.";


    statusMessage.classList.add(
      "error"
    );

  }

}



/* =========================================================
   IMAGE COMPRESSION
   ========================================================= */

async function compressImage(file) {

  const bitmap =
    await createImageBitmap(file);


  const MAX_WIDTH =
    1280;


  let width =
    bitmap.width;


  let height =
    bitmap.height;


  if (width > MAX_WIDTH) {

    const ratio =
      MAX_WIDTH / width;


    width =
      MAX_WIDTH;


    height =
      Math.round(
        height * ratio
      );

  }


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.width =
    width;


  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d",
      {
        alpha: false
      }
    );


  ctx.drawImage(
    bitmap,
    0,
    0,
    width,
    height
  );


  let blob =
    await canvasToBlob(
      canvas,
      0.68
    );


  if (
    blob.size >
    700 * 1024
  ) {

    blob =
      await canvasToBlob(
        canvas,
        0.52
      );

  }


  if (
    blob.size >
    1000 * 1024
  ) {

    blob =
      await canvasToBlob(
        canvas,
        0.42
      );

  }


  bitmap.close();


  return blob;

}



function canvasToBlob(
  canvas,
  quality
) {

  return new Promise(
    (resolve, reject) => {

      canvas.toBlob(
        blob => {

          if (!blob) {

            reject(
              new Error(
                "Compression failed"
              )
            );

            return;

          }


          resolve(blob);

        },
        "image/jpeg",
        quality
      );

    }
  );

}



/* =========================================================
   LOCATION
   ========================================================= */

function findLocation() {

  locationStatus.textContent =
    "Finding location…";


  if (
    !navigator.geolocation
  ) {

    locationStatus.textContent =
      "Location unavailable";

    return;

  }


  navigator.geolocation.getCurrentPosition(

    position => {

      const latitude =
        position.coords.latitude;


      const longitude =
        position.coords.longitude;


      currentLocation = {
        latitude,
        longitude
      };


      currentDigipin =
        getDIGIPIN(
          latitude,
          longitude
        );


      locationStatus.innerHTML =
        '<span class="ok">Location found ✓</span>';


      gpsRow.style.display =
        "grid";


      gpsValue.textContent =
        `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;


      if (currentDigipin) {

        digipinRow.style.display =
          "grid";


        digipinValue.textContent =
          formatDIGIPIN(
            currentDigipin
          );

      }

    },


    error => {

      console.error(
        "[ROADIES] GPS ERROR",
        error
      );


      locationStatus.textContent =
        "Location unavailable";

    },


    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 30000
    }

  );

}



/* =========================================================
   DIGIPIN
   ========================================================= */

function getDIGIPIN(
  lat,
  lon
) {

  const L = [

    ["F", "C", "9", "8"],

    ["J", "3", "2", "7"],

    ["K", "4", "5", "6"],

    ["L", "M", "P", "T"]

  ];


  let minLat =
    2.5;


  let maxLat =
    38.5;


  let minLon =
    63.5;


  let maxLon =
    99.5;


  if (
    lat < minLat ||
    lat > maxLat ||
    lon < minLon ||
    lon > maxLon
  ) {

    return "";

  }


  let result =
    "";


  for (
    let level = 1;
    level <= 10;
    level++
  ) {

    const latDiv =
      (maxLat - minLat) / 4;


    const lonDiv =
      (maxLon - minLon) / 4;


    /*
      LATITUDE
    */

    let nextMaxLat =
      maxLat;


    let nextMinLat =
      maxLat - latDiv;


    let row =
      0;


    for (
      let x = 0;
      x < 4;
      x++
    ) {

      if (
        lat >= nextMinLat &&
        lat < nextMaxLat
      ) {

        row =
          x;

        break;

      }


      nextMaxLat =
        nextMinLat;


      nextMinLat =
        nextMaxLat - latDiv;

    }


    /*
      LONGITUDE
    */

    let nextMinLon =
      minLon;


    let nextMaxLon =
      minLon + lonDiv;


    let column =
      0;


    for (
      let x = 0;
      x < 4;
      x++
    ) {

      if (
        lon >= nextMinLon &&
        lon < nextMaxLon
      ) {

        column =
          x;

        break;

      }


      if (
        x < 3
      ) {

        nextMinLon =
          nextMaxLon;


        nextMaxLon =
          nextMinLon + lonDiv;

      }

    }


    result +=
      L[row][column];


    minLat =
      nextMinLat;


    maxLat =
      nextMaxLat;


    minLon =
      nextMinLon;


    maxLon =
      nextMaxLon;

  }


  return result;

}



/* =========================================================
   DIGIPIN DISPLAY
   ========================================================= */

function formatDIGIPIN(code) {

  if (
    !code ||
    code.length !== 10
  ) {

    return code;

  }


  return (
    code.substring(0, 3) +
    " " +
    code.substring(3, 7) +
    " " +
    code.substring(7, 10)
  );

}



/* =========================================================
   SEND BUTTON
   ========================================================= */

sendButton.addEventListener(
  "click",
  async () => {

    /*
      If this is the failure-state button,
      go back to camera.
    */

    if (
      sendMode === "retry"
    ) {

      openCamera();

      return;

    }


    if (isSending) {
      return;
    }


    if (!compressedBlob) {

      statusMessage.textContent =
        "Photo is still preparing.";

      return;

    }


    if (
      currentLocation.latitude === null ||
      currentLocation.longitude === null
    ) {

      statusMessage.textContent =
        "Waiting for location…";

      findLocation();

      return;

    }


    await sendReport();

  }
);



/* =========================================================
   SEND REPORT
   ========================================================= */

async function sendReport() {

  isSending =
    true;


  sendMode =
    "sending";


  sendButton.disabled =
    true;


  sendButton.textContent =
    "Sending…";


  statusMessage.textContent =
    "Sending report…";


  statusMessage.classList.remove(
    "error"
  );


  const reportId =
    crypto.randomUUID();


  const now =
    new Date();


  const filePath =
    `${now.getFullYear()}/` +
    `${String(
      now.getMonth() + 1
    ).padStart(2, "0")}/` +
    `${reportId}.jpg`;


  console.log(
    "[ROADIES] Starting upload",
    {
      filePath,
      size: compressedBlob.size,
      latitude: currentLocation.latitude,
      longitude: currentLocation.longitude,
      digipin: currentDigipin
    }
  );


  try {


    /* =====================================================
       STEP 1
       UPLOAD PHOTO
       ===================================================== */

    const {
      data: uploadData,
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(
          filePath,
          compressedBlob,
          {
            contentType:
              "image/jpeg",

            cacheControl:
              "3600",

            upsert:
              false
          }
        );


    if (uploadError) {

      console.error(
        "[ROADIES] STORAGE UPLOAD FAILED",
        {
          message:
            uploadError.message,

          details:
            uploadError.details,

          hint:
            uploadError.hint,

          statusCode:
            uploadError.statusCode
        }
      );


      throw new Error(
        "STORAGE_UPLOAD_FAILED"
      );

    }


    console.log(
      "[ROADIES] Photo uploaded",
      uploadData
    );



    /* =====================================================
       STEP 2
       DATABASE
       ===================================================== */

    const reportPayload = {

      latitude:
        currentLocation.latitude,

      longitude:
        currentLocation.longitude,

      digipin:
        currentDigipin || null,

      comment:
        commentInput.value.trim() || null,

      photo_url:
        uploadData.path,

      status:
        "new"

    };


    console.log(
      "[ROADIES] Inserting report",
      reportPayload
    );


    const {
      error: reportError
    } =
      await supabaseClient
        .from(REPORT_TABLE)
        .insert(
          reportPayload
        );


    if (reportError) {

      console.error(
        "[ROADIES] DATABASE INSERT FAILED",
        {
          message:
            reportError.message,

          details:
            reportError.details,

          hint:
            reportError.hint,

          code:
            reportError.code
        }
      );


      throw new Error(
        "DATABASE_INSERT_FAILED"
      );

    }


    console.log(
      "[ROADIES] REPORT SUCCESS"
    );


    /* =====================================================
       SUCCESS
       ===================================================== */

    isSending =
      false;


    showScreen(
      successScreen
    );


    resetForm();


  } catch (error) {

    console.error(
      "[ROADIES] SEND FAILED",
      error
    );


    /*
      User sees simple message.
      Developer sees actual error
      in browser console.
    */

    statusMessage.textContent =
      "Something went wrong. Try again.";


    statusMessage.classList.add(
      "error"
    );


    sendMode =
      "retry";


    sendButton.disabled =
      false;


    sendButton.textContent =
      "Try again";


    isSending =
      false;

  }

}



/* =========================================================
   RESET
   ========================================================= */

function resetForm() {

  compressedBlob =
    null;


  currentLocation = {
    latitude: null,
    longitude: null
  };


  currentDigipin =
    null;


  sendMode =
    "send";


  isSending =
    false;


  commentInput.value =
    "";


  photoSize.textContent =
    "Preparing...";


  locationStatus.textContent =
    "Finding location...";


  digipinValue.textContent =
    "";


  gpsValue.textContent =
    "";


  digipinRow.style.display =
    "none";


  gpsRow.style.display =
    "none";


  statusMessage.textContent =
    "";


  statusMessage.classList.remove(
    "error"
  );


  sendButton.textContent =
    "Send photo";


  sendButton.disabled =
    true;


  fileInput.value =
    "";


  if (currentObjectUrl) {

    URL.revokeObjectURL(
      currentObjectUrl
    );

    currentObjectUrl =
      null;

  }


  photoPreview.removeAttribute(
    "src"
  );

}



/* =========================================================
   ANOTHER REPORT
   ========================================================= */

anotherButton.addEventListener(
  "click",
  () => {

    openCamera();

  }
);



/* =========================================================
   FORMAT BYTES
   ========================================================= */

function formatBytes(
  bytes
) {

  if (
    bytes < 1024
  ) {

    return `${bytes} B`;

  }


  if (
    bytes < 1024 * 1024
  ) {

    return (
      Math.round(
        bytes / 1024
      ) +
      " KB"
    );

  }


  return (
    (
      bytes /
      (1024 * 1024)
    ).toFixed(1) +
    " MB"
  );

}
