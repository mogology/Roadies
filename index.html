<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <title>Roadies</title>

  <!-- Supabase official browser client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #fff;
      color: #111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      width: 100%;
      min-height: 100vh;
      padding:
        max(28px, env(safe-area-inset-top))
        24px
        max(32px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.16em;
    }

    .country {
      opacity: 0.5;
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    /* HOME */

    .home-content {
      margin-top: 72px;
      max-width: 480px;
    }

    .number {
      font-size: 13px;
      letter-spacing: 0.15em;
      margin-bottom: 26px;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 12vw, 88px);
      line-height: 0.88;
      letter-spacing: -0.065em;
      font-weight: 700;
    }

    .home-copy {
      margin-top: 32px;
      font-size: 18px;
      line-height: 1.35;
      max-width: 310px;
    }

    .primary-button {
      margin-top: 42px;
      width: 100%;
      max-width: 330px;
      height: 56px;
      background: #111;
      color: white;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .primary-button:disabled {
      background: #d9d9d9;
      cursor: default;
    }

    /* CAMERA */

    .camera-content {
      margin-top: 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .camera-title {
      font-size: 42px;
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 700;
      margin-bottom: 28px;
    }

    .camera-box {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #f3f3f3;
      position: relative;
      overflow: hidden;
    }

    #cameraPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .camera-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #fileInput {
      display: none;
    }

    /* REVIEW */

    .review-content {
      margin-top: 55px;
      max-width: 520px;
    }

    .review-title {
      font-size: clamp(52px, 13vw, 82px);

      letter-spacing: -0.065em;
      font-weight: 700;

    .photo-preview {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      background: #f3f3f3;
      margin-bottom: 30px;
    }

    .meta {
      border-top: 1px solid #111;
    }

    .meta-row {
      display: grid;
      grid-template-columns: 105px 1fr;
      gap: 15px;
      padding: 14px 0;

      font-size: 13px;

    .meta-label {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .meta-value {
      word-break: break-word;
    }

    .ok {
      font-weight: 600;
    }

    textarea {
      margin-top: 24px;
      width: 100%;
      min-height: 100px;
      border: 1px solid #ddd;
      padding: 15px;
      resize: vertical;
      outline: none;
      font-size: 15px;
      background: white;
    }

    textarea:focus {
      border-color: #111;
    }

    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #555;
      min-height: 18px;
    }

      color: #b00020;

    /* SUCCESS */

    .success-content {
      margin-top: 72px;
      max-width: 480px;
    }

    .success-number {
      font-size: 13px;
      letter-spacing: 0.15em;
      margin-bottom: 26px;
    }

    .success-title {
      margin: 0;
      font-size: clamp(58px, 14vw, 96px);

      letter-spacing: -0.07em;

    .success-copy {

    }

      margin-top: 42px;
      width: 100%;
      max-width: 330px;
      height: 56px;
      background: white;
      color: #111;
      border: 1px solid #111;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (min-width: 700px) {
      .app {
        padding-left: 7vw;
        padding-right: 7vw;
      }
    }

<body>

<div class="app">

  <div class="top">
    <div class="brand">ROADIES</div>
    <div class="country">INDIA / 01</div>
  </div>

  <!-- HOME -->
  <section id="homeScreen" class="screen active">

    <div class="home-content">

      <div class="number">01</div>

      <h1>
        Better roads<br />
        begin here.
      </h1>

      <div class="home-copy">
        See a broken road?<br />
        Make it visible.
      </div>

      <button
        id="startButton"
        class="primary-button"
      >
        Report a broken road
      </button>

    </div>

  </section>


  <!-- CAMERA -->
  <section id="cameraScreen" class="screen">

    <div class="camera-content">

      <div class="camera-title">
        Show us<br />
        the road.
      </div>

      <div class="camera-box">

        <video
          id="cameraPreview"
          autoplay
          playsinline
          muted
        ></video>

        <div class="camera-placeholder">
          Camera ready
        </div>

      </div>

      <input
        id="fileInput"
        type="file"
        accept="image/*"
        capture="environment"
      />

      <button
        id="takePhotoButton"
        class="primary-button"
      >
        Take photo
      </button>

    </div>

  </section>


  <!-- REVIEW -->
  <section id="reviewScreen" class="screen">

    <div class="review-content">

      <h1 class="review-title">
        Almost<br />
        there.
      </h1>

      <img
        id="photoPreview"
        class="photo-preview"
        alt="Road report"
      />

      <div class="meta">

        <div class="meta-row">
          <div class="meta-label">Photo</div>
          <div id="photoSize" class="meta-value">Preparing...</div>
        </div>

        <div class="meta-row">
          <div class="meta-label">Location</div>
          <div id="locationStatus" class="meta-value">
            Finding location...
          </div>
        </div>

        <div
          id="digipinRow"
          class="meta-row"
          style="display:none;"
        >
          <div class="meta-label">DIGIPIN</div>
          <div id="digipinValue" class="meta-value"></div>
        </div>

        <div
          id="gpsRow"
          class="meta-row"
          style="display:none;"
        >
          <div class="meta-label">GPS</div>
          <div id="gpsValue" class="meta-value"></div>
        </div>

      </div>

      <textarea
        id="commentInput"
        maxlength="300"
        placeholder="Anything else? Optional."
      ></textarea>

      <div
        id="statusMessage"
        class="status"
      ></div>

      <button
        id="sendButton"
        class="primary-button"
        disabled
      >
        Send photo
      </button>

    </div>

  </section>


  <!-- SUCCESS -->
  <section id="successScreen" class="screen">

    <div class="success-content">

      <div class="success-number">REPORT RECEIVED</div>

      <h1 class="success-title">
        Thank<br />
        you.
      </h1>

      <div class="success-copy">
        Your road report has been recorded.
      </div>

      <button
        id="anotherButton"
        class="secondary-button"
      >
        Report another road
      </button>

    </div>

  </section>

</div>


<script>
/* =========================================================
   ROADIES CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://rdxavtxfifvuwrcnsga.supabase.co";

/*
  IMPORTANT:
  Put your Supabase PUBLISHABLE key here.

  Do NOT put your sb_secret key here.
*/
const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_AFElmTasdfqRKSu9kUz6BA_odt416e_";

const STORAGE_BUCKET = "road-report";
const REPORT_TABLE = "reports";


/* =========================================================
   SUPABASE
   ========================================================= */

const { createClient } = window.supabase;

const supabaseClient = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY,
  {
    auth: {
      persistSession: false,
      autoRefreshToken: false,
      detectSessionInUrl: false
    }
  }
);


/* =========================================================
   ELEMENTS
   ========================================================= */

const homeScreen = document.getElementById("homeScreen");
const cameraScreen = document.getElementById("cameraScreen");
const reviewScreen = document.getElementById("reviewScreen");
const successScreen = document.getElementById("successScreen");

const startButton =
  document.getElementById("startButton");

const takePhotoButton =
  document.getElementById("takePhotoButton");

const anotherButton =
  document.getElementById("anotherButton");

const fileInput =
  document.getElementById("fileInput");

const photoPreview =
  document.getElementById("photoPreview");

const photoSize =
  document.getElementById("photoSize");

const locationStatus =
  document.getElementById("locationStatus");

const digipinRow =
  document.getElementById("digipinRow");

const digipinValue =
  document.getElementById("digipinValue");

const gpsRow =
  document.getElementById("gpsRow");

const gpsValue =
  document.getElementById("gpsValue");

const commentInput =
  document.getElementById("commentInput");

const statusMessage =
  document.getElementById("statusMessage");

const sendButton =
  document.getElementById("sendButton");


/* =========================================================
   STATE
   ========================================================= */

let compressedBlob = null;

let currentLocation = {
  latitude: null,
  longitude: null
};

let currentDigipin = null;

let currentObjectUrl = null;

let isSending = false;


/* =========================================================
   SCREEN CONTROL
   ========================================================= */

function showScreen(screen) {

  [
    homeScreen,
    cameraScreen,
    reviewScreen,
    successScreen
  ].forEach((s) => {
    s.classList.remove("active");
  });

  screen.classList.add("active");
}


/* =========================================================
   START
   ========================================================= */

startButton.addEventListener("click", () => {

  showScreen(cameraScreen);

  setTimeout(() => {
    fileInput.click();
  }, 150);

});


/* =========================================================
   CAMERA / PHOTO
   ========================================================= */

takePhotoButton.addEventListener("click", () => {
  fileInput.click();
});


fileInput.addEventListener("change", async (event) => {

  const file = event.target.files?.[0];

  if (!file) {
    return;
  }

  await preparePhoto(file);

});


/* =========================================================
   PREPARE PHOTO
   ========================================================= */

async function preparePhoto(file) {

  compressedBlob = null;

  sendButton.disabled = true;

  statusMessage.textContent =
    "Optimising photo…";

  statusMessage.classList.remove("error");

  showScreen(reviewScreen);

  try {

    const blob =
      await compressImage(file);

    compressedBlob = blob;

    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
    }

    currentObjectUrl =
      URL.createObjectURL(blob);

    photoPreview.src =
      currentObjectUrl;

    photoSize.textContent =
      formatBytes(blob.size);

    statusMessage.textContent =
      "Photo optimised ✓";

    sendButton.disabled = false;

    findLocation();

  } catch (error) {

    console.error(
      "Photo preparation error:",
      error
    );

    statusMessage.textContent =
      "Could not prepare photo.";

    statusMessage.classList.add("error");

  }

}


/* =========================================================
   IMAGE COMPRESSION
   ========================================================= */

async function compressImage(file) {

  const bitmap =
    await createImageBitmap(file);

  const MAX_WIDTH = 1280;

  let width =
    bitmap.width;

  let height =
    bitmap.height;

  if (width > MAX_WIDTH) {

    const ratio =
      MAX_WIDTH / width;

    width =
      MAX_WIDTH;

    height =
      Math.round(height * ratio);

  }

  const canvas =
    document.createElement("canvas");

  canvas.width =
    width;

  canvas.height =
    height;

  const ctx =
    canvas.getContext("2d", {
      alpha: false
    });

  ctx.drawImage(
    bitmap,
    0,
    0,
    width,
    height
  );

  let blob =
    await canvasToBlob(
      canvas,
      0.68
    );

  /*
    Second pass if the image is still large.
  */
  if (blob.size > 700 * 1024) {

    blob =
      await canvasToBlob(
        canvas,
        0.52
      );

  }

  /*
    Final aggressive pass for very large phones/photos.
  */
  if (blob.size > 1000 * 1024) {

    blob =
      await canvasToBlob(
        canvas,
        0.42
      );

  }

  bitmap.close();

  return blob;
}


function canvasToBlob(
  canvas,
  quality
) {

  return new Promise((resolve, reject) => {

    canvas.toBlob(
      (blob) => {

        if (!blob) {
          reject(
            new Error(
              "Image compression failed"
            )
          );
          return;
        }

        resolve(blob);

      },
      "image/jpeg",
      quality
    );

  });

}


/* =========================================================
   LOCATION
   ========================================================= */

function findLocation() {

  locationStatus.textContent =
    "Finding location…";

  if (!navigator.geolocation) {

    locationStatus.textContent =
      "Location unavailable";

    return;

  }

  navigator.geolocation.getCurrentPosition(

    (position) => {

      const latitude =
        position.coords.latitude;

      const longitude =
        position.coords.longitude;

      currentLocation.latitude =
        latitude;

      currentLocation.longitude =
        longitude;

      currentDigipin =
        getDIGIPIN(
          latitude,
          longitude
        );

      locationStatus.innerHTML =
        '<span class="ok">Location found ✓</span>';

      gpsRow.style.display =
        "grid";

      gpsValue.textContent =
        `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;

      if (currentDigipin) {

        digipinRow.style.display =
          "grid";

        /*
          Display format only.
          Database stores continuous 10-character code.
        */
        digipinValue.textContent =
          formatDIGIPIN(currentDigipin);

      }

    },

    (error) => {

      console.error(
        "Geolocation error:",
        error
      );

      locationStatus.textContent =
        "Location unavailable";

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 30000
    }

  );

}


/* =========================================================
   OFFICIAL DIGIPIN
   India Post final algorithm
   ========================================================= */

function getDIGIPIN(lat, lon) {

  /*
    India Post final DIGIPIN grid.

    Rows are ordered north -> south.
    Columns are ordered west -> east.
  */

  const L = [
    ["F", "C", "9", "8"],
    ["J", "3", "2", "7"],
    ["K", "4", "5", "6"],
    ["L", "M", "P", "T"]
  ];

  let minLat = 2.5;
  let maxLat = 38.5;

  let minLon = 63.5;
  let maxLon = 99.5;

  const LatDivBy = 4;
  const LonDivBy = 4;

  if (
    lat < minLat ||
    lat > maxLat ||
    lon < minLon ||
    lon > maxLon
  ) {
    return "";
  }

  let result = "";

  for (
    let level = 1;
    level <= 10;
    level++
  ) {

    const latDiv =
      (maxLat - minLat) / LatDivBy;

    const lonDiv =
      (maxLon - minLon) / LonDivBy;


    /* -----------------------------------------
       Find row
       ----------------------------------------- */

    let nextMaxLat =
      maxLat;

    let nextMinLat =
      maxLat - latDiv;

    let row = 0;

    for (
      let x = 0;
      x < LatDivBy;
      x++
    ) {

      if (
        lat >= nextMinLat &&
        lat < nextMaxLat
      ) {

        row = x;
        break;

      } else {

        nextMaxLat =
          nextMinLat;

        nextMinLat =
          nextMaxLat - latDiv;

      }

    }


    /* -----------------------------------------
       Find column
       ----------------------------------------- */

    let nextMinLon =
      minLon;

    let nextMaxLon =
      minLon + lonDiv;

    let column = 0;

    for (
      let x = 0;
      x < LonDivBy;
      x++
    ) {

      if (
        lon >= nextMinLon &&
        lon < nextMaxLon
      ) {

        column = x;
        break;

      }

      else if (
        (nextMinLon + lonDiv) <
        maxLon
      ) {

        nextMinLon =
          nextMaxLon;

        nextMaxLon =
          nextMinLon + lonDiv;

      }

      else {

        column = x;

      }

    }


    result +=
      L[row][column];


    /* -----------------------------------------
       Update bounding box
       ----------------------------------------- */

    minLat =
      nextMinLat;

    maxLat =
      nextMaxLat;

    minLon =
      nextMinLon;

    maxLon =
      nextMaxLon;

  }

  return result;
}


/* =========================================================
   DIGIPIN DISPLAY
   ========================================================= */

function formatDIGIPIN(code) {

  if (!code || code.length !== 10) {
    return code;
  }

  return (
    code.substring(0, 3) +
    " " +
    code.substring(3, 7) +
    " " +
    code.substring(7, 10)
  );

}


/* =========================================================
   SEND
   ========================================================= */

sendButton.addEventListener(
  "click",
  async () => {

    if (isSending) {
      return;
    }

    if (!compressedBlob) {

      statusMessage.textContent =
        "Photo is still preparing.";

      return;

    }

    if (
      currentLocation.latitude === null ||
      currentLocation.longitude === null
    ) {

      statusMessage.textContent =
        "Waiting for location…";

      return;

    }

    await sendReport();

  }
);


/* =========================================================
   SEND REPORT
   ========================================================= */

async function sendReport() {

  isSending = true;

  sendButton.disabled = true;

  sendButton.textContent =
    "Sending…";

  statusMessage.textContent =
    "Sending report…";

  statusMessage.classList.remove("error");


  const reportId =
    crypto.randomUUID();

  const filePath =
    `${new Date().getFullYear()}/` +
    `${new Date().getMonth() + 1}/` +
    `${reportId}.jpg`;


  try {

    /* -----------------------------------------
       1. Upload image
       ----------------------------------------- */

    const {
      data: uploadData,
      error: uploadError
    } =
      await supabaseClient
        .storage
        .from(STORAGE_BUCKET)
        .upload(
          filePath,
          compressedBlob,
          {
            contentType: "image/jpeg",
            cacheControl: "3600",
            upsert: false
          }
        );


    if (uploadError) {

      console.error(
        "Storage upload error:",
        uploadError
      );

      throw uploadError;

    }


    /* -----------------------------------------
       2. Insert report
       ----------------------------------------- */

    const {
      error: reportError
    } =
      await supabaseClient
        .from(REPORT_TABLE)
        .insert({
          latitude:
            currentLocation.latitude,

          longitude:
            currentLocation.longitude,

          /*
            Continuous format for database.
            Example:
            422353228L
          */
          digipin:
            currentDigipin || null,

          comment:
            commentInput.value.trim() || null,

          /*
            Private storage path.
          */
          photo_url:
            uploadData.path,

          status:
            "new"

          /*
            created_at and
            photo_expires_at are intentionally
            omitted.

            Supabase/Postgres supplies them.
          */
        });


    if (reportError) {

      console.error(
        "Database insert error:",
        reportError
      );

      /*
        The image may already exist.
        Keep the path in the error log
        for debugging, but don't show it
        to the normal user.
      */

      throw reportError;

    }


    /* -----------------------------------------
       SUCCESS
       ----------------------------------------- */

    showScreen(successScreen);

    resetForm();


  } catch (error) {

    console.error(
      "ROADIES SEND ERROR:",
      error
    );

    /*
      For the user:
      no ugly "Failed to fetch".
    */

    statusMessage.textContent =
      "Something went wrong. Try again.";

    statusMessage.classList.add("error");

    sendButton.textContent =
      "Try again";

    /*
      IMPORTANT:
      User requested that retry goes back
      to camera instead of retrying upload.
    */

    sendButton.onclick =
      () => {

        sendButton.onclick = null;

        sendButton.textContent =
          "Send photo";

        isSending = false;

        resetForm();

        showScreen(cameraScreen);

        setTimeout(() => {
          fileInput.click();
        }, 150);

      };

    sendButton.disabled = false;

    return;

  }

}


/* =========================================================
   RESET
   ========================================================= */

function resetForm() {

  compressedBlob = null;

  currentLocation = {
    latitude: null,
    longitude: null
  };

  currentDigipin = null;

  commentInput.value = "";

  photoPreview.removeAttribute("src");

  photoSize.textContent =
    "Preparing...";

  locationStatus.textContent =
    "Finding location...";

  digipinValue.textContent =
    "";

  gpsValue.textContent =
    "";

  digipinRow.style.display =
    "none";

  gpsRow.style.display =
    "none";

  statusMessage.textContent =
    "";

  sendButton.textContent =
    "Send photo";

  sendButton.disabled =
    true;

  sendButton.onclick =
    null;

  isSending =
    false;

  fileInput.value =
    "";

}


/* =========================================================
   SUCCESS -> NEW REPORT
   ========================================================= */

anotherButton.addEventListener(
  "click",
  () => {

    resetForm();

    showScreen(cameraScreen);

    setTimeout(() => {
      fileInput.click();
    }, 150);

  }
);


/* =========================================================
   HELPERS
   ========================================================= */

function formatBytes(bytes) {

  if (bytes < 1024) {
    return `${bytes} B`;
  }

  if (bytes < 1024 * 1024) {

    return (
      Math.round(bytes / 1024) +
      " KB"
    );

  }

  return (
    (bytes / (1024 * 1024))
      .toFixed(1) +
    " MB"
  );

}


/* =========================================================
   SERVICE WORKER REGISTRATION
   ========================================================= */

if (
  "serviceWorker" in navigator
) {

  window.addEventListener(
    "load",
    () => {

      /*
        Only register if sw.js exists.
        We can add the real offline shell
        in the next step.
      */

      navigator.serviceWorker
        .register("/sw.js")
        .catch(() => {
          /*
            Silent failure.
            App still works normally.
          */
        });

    }
  );

}

</script>

</body>
</html>
